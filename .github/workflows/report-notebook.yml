name: Actividad 6 - Notebook ejecutado y reporte PDF

on:
  push:
    paths:
      - '.github/workflows/report-notebook.yml'
      - 'fuentes/generar_reporte.py'
      - 'notebooks/Evaluacion_Actividad6.ipynb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  documentar:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar entorno y auditor PDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pymupdf
      - name: Ejecutar notebook con resultados auténticos
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=180 notebooks/Evaluacion_Actividad6.ipynb
      - name: Comprobar todas las celdas del notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("notebooks/Evaluacion_Actividad6.ipynb")
          n=json.loads(p.read_text(encoding="utf-8"))
          c=[i for i in n["cells"] if i["cell_type"]=="code"]
          assert len(c)>=8
          assert all(i["execution_count"] is not None and i["outputs"] for i in c)
          assert not any(o["output_type"]=="error" for i in c for o in i["outputs"])
          print("Notebook verificado:",len(c),"celdas de código; 0 errores")
          PY
      - name: Generar PDF académico desde CSV/JSON reales
        run: python -m fuentes.generar_reporte
      - name: Comprobar paginación, texto, figuras y renderizar vistas previas
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          p=Path("docs/Reporte_Tecnico_Actividad6.pdf")
          d=fitz.open(p)
          count=len(d)
          figures=sum(len(page.get_images(full=True)) for page in d)
          txt="\n".join(page.get_text() for page in d)
          print("PDF:",count,"páginas,",figures,"figuras,",p.stat().st_size,"bytes")
          assert 6<=count<=8, f"PDF fuera de extensión sugerida: {count}"
          assert figures>=5, f"Faltan gráficas: {figures}"
          for key in ["Banking Conversion", "McNemar", "bootstrap", "Trello",
                      "ROC-AUC","no causal", "Regresión logística"]:
              assert key.lower() in txt.lower(),f"Falta sección {key}"
          preview=Path("docs/vistas_previas")
          preview.mkdir(parents=True,exist_ok=True)
          for i in range(count):
              pix=d[i].get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False)
              pix.save(preview/f"pagina_{i+1:02d}.png")
          d.close()
          PY
      - name: Guardar reporte y vistas previas como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banking-actividad6-reporte
          path: |
            docs/Reporte_Tecnico_Actividad6.pdf
            docs/vistas_previas/
            notebooks/Evaluacion_Actividad6.ipynb
          if-no-files-found: warn
      - name: Publicar notebook y PDF en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/Evaluacion_Actividad6.ipynb docs/Reporte_Tecnico_Actividad6.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: notebook ejecutado y PDF técnico de Actividad 6"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
