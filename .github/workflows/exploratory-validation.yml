name: Actividad 6 - Estudio adicional y métricas comerciales

on:
  push:
    paths:
      - '.github/workflows/exploratory-validation.yml'
      - 'fuentes/analisis_adicional.py'
      - 'fuentes/generar_anexo.py'
  workflow_dispatch:

concurrency:
  group: banking-actividad6-adicional
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar entorno
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar no regresiones
        run: python -m unittest discover -s tests -v
      - name: Tercer modelo, Lift top-20 y fairness descriptivo
        run: python -m fuentes.analisis_adicional
      - name: Validar archivos sin sustituir selección original
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path("resultados")
          a=root/"analisis_adicional"
          ori=json.loads((root/"seleccion_congelada.json").read_text())
          add=json.loads((a/"resumen_adicional.json").read_text())
          x=pd.read_csv(a/"tercer_modelo_metrics.csv")
          ranks=pd.read_csv(a/"metricas_presupuesto20.csv")
          assert ori["modelo_seleccionado_en_validacion"]=="RandomForest"
          assert add["test_previamente_inspeccionado"] is True
          assert len(x)==1 and x.iloc[0]["Modelo"]=="HistGradientBoosting"
          assert ranks["Modelo"].nunique()==3
          assert ranks["precision_at_20"].between(0,1).all()
          assert (ranks["lift_at_20"]>0).all()
          assert abs(x.iloc[0]["validation_threshold"]-add["f2_max_validacion"]["umbral"])<1e-12
          assert (root/"figuras/07_lift_presupuesto20.png").is_file()
          print("Completo: modelo extra, precisión@20, lift, baseline, segmentos y advertencia exploratoria.")
          PY
      - name: Crear y validar anexo académico exploratorio
        run: |
          python -m pip install pymupdf
          python -m fuentes.generar_anexo
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path("docs/Anexo_Mejora_Modelos_Actividad6.pdf")
          assert p.is_file() and p.stat().st_size>30000
          d=fitz.open(p)
          print("ANEXO:",len(d),"páginas, imágenes:",sum(len(x.get_images()) for x in d))
          assert 2<=len(d)<=3
          assert "EXPLORATORIO" in "".join(page.get_text() for page in d).upper()
          PY
      - name: Evidencia CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-actividad6-analisis-adicional
          path: |
            resultados/analisis_adicional/
            resultados/figuras/07_lift_presupuesto20.png
            docs/Anexo_Mejora_Modelos_Actividad6.pdf
          if-no-files-found: warn
      - name: Publicar anexo científico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/analisis_adicional/ resultados/figuras/07_lift_presupuesto20.png docs/Anexo_Mejora_Modelos_Actividad6.pdf
          if ! git diff --cached --quiet; then
            git commit -m "results: modelo adicional y presupuesto comercial exploratorios"
            git pull --no-rebase -X ours origin main
            git push origin HEAD:main
          fi
